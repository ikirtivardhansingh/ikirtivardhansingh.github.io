name: Deploy TanStack Start to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build

      - name: Generate static index.html from SSR build
        run: |
          # Start preview server in background
          bunx vite preview --port 4173 &
          PREVIEW_PID=$!
          
          # Wait for preview server to come up
          sleep 4
          
          # Render the page directly into dist/client/index.html
          curl -s http://127.0.0.1:4173 > dist/client/index.html
          
          # Kill preview process
          kill $PREVIEW_PID || true
          
          # Add .nojekyll so GitHub Pages doesn't ignore asset folders
          touch dist/client/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
